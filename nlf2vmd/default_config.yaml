# NLF → VMD 変換の設定（初期値）。仕様は vmd.md を参照。
#
# * このファイルをコピーして値を書き換え、--config で渡すと上書きできます（書いた項目だけ変わります）。
# * コマンドラインの --set jitter.outlier_deg_per_s=540 のように 1 項目ずつ変えることもできます。
# * 長さのしきい値はメートルで書きます。ステージ5以降は内部でスケール係数を掛けて使います。
# * One Euro フィルタの min_cutoff [Hz] を小さくするほど強く平滑化し、beta を大きくするほど
#   速い動きで平滑化が弱まります（キレが残ります）。

# ---- 1. 読み込み・正規化 ----
input:
  coords: auto              # auto | camera（Y下向き・Z奥向き）| yup（Y上向き・右手系）。auto は入力の coord_system、無ければ camera
  person_index: 0           # 複数人物が含まれる場合に扱う人物の番号
  target_fps: 30.0          # リサンプル先の fps（MMD は 30fps）

# ---- 2. 姿勢のジッター制御 ----
jitter:
  outlier_deg_per_s: 720.0  # これを超える角速度の単独フレームを前後から補間して置き換える
  one_euro:
    d_cutoff: 1.0
    zero_phase: true        # 順方向と逆方向の平均で遅れを打ち消す
    groups:                 # 関節グループ別の強さ（クォータニオン成分に掛ける）
      torso: {min_cutoff: 1.5, beta: 0.5}   # 骨盤・背骨
      head:  {min_cutoff: 1.5, beta: 0.5}   # 首・頭
      arm:   {min_cutoff: 2.5, beta: 1.0}   # 鎖骨・肩・肘
      wrist: {min_cutoff: 2.0, beta: 0.5}   # 手首・手
      leg:   {min_cutoff: 2.5, beta: 1.0}   # 股関節・膝・足首・足先
  root_median_window: 5     # ルート移動量のスパイク除去（メディアンの窓幅、フレーム）

# ---- 3. FK と接地点 ----
body:
  heel_toe_vertices: 4      # かかと・つま先それぞれに使う頂点数（その平均を接地点とする）
  sole_band_m: 0.025        # 足の最下点からこの高さ以内の頂点を足裏の候補にする

# ---- 4. 床面推定と定数オフセット ----
floor:
  low_speed_m_per_s: 0.2    # 水平速度がこれ未満のかかと・つま先を床の候補点にする
  ransac_iterations: 300
  ransac_inlier_m: 0.02
  min_points: 30            # 候補点がこれ未満なら傾き補正をせず、低い点の高さだけで床を決める
  align_tilt: true          # 床の法線が +Y になるよう全体を回転する
  max_tilt_deg: 30.0        # これより大きい傾きは誤推定とみなして使わない
  tilt_method: vectors      # vectors: 同じフレーム内の接地点どうしを結ぶベクトル（かかと→つま先・左足→右足）が床と平行になる傾き。
                            #   体全体の位置のずれ（単眼推定の奥行きのずれ）に影響されない。床と平行から大きく外れるベクトル
                            #   （つま先立ち・片足を上げて止めている等）は Tukey の重みで除く
                            # plane: 全フレームの接地点に 1 枚の平面を当てはめる（位置のずれがあると視線の傾きを床の傾きと取り違える）
  min_vector_spread_m: 0.08 # vectors: ベクトルの水平方向の広がり（主軸ごとの二乗平均平方根）。2 方向ともこれ以上なら床全体、
                            #   1 方向だけならその方向の傾きだけを補正する（sole_normal_weight_m=0 のとき）
  sole_normal_weight_m: 0.05 # vectors: 接地中の足裏の向きも「床と垂直」の条件として加える重み（この長さのベクトル 1 本分）。
                            #   ベクトルで決まらない方向の傾き（横向きのまま横へ歩く等）を補う。0 で使わない
  min_spread_m: 0.15        # plane: 床の候補点の平面内の広がり（2 番目の主軸の標準偏差）がこれ未満なら傾きは補正しない
  segment_mode: false       # 長尺で床が変わる場合: 区間ごとの定数オフセットにする
  segment_sec: 10.0
  segment_blend_sec: 1.0    # 区間の間のコサイン補間の長さ（1秒未満を指定しても1秒にする）
  horizontal_origin: first_frame  # first_frame | mean | none（骨盤の水平位置の原点）
  flip_facing: false        # Y軸周り180度回転（MMD で体の向きが逆になった場合）
  seed: 0

# ---- 5. MMD スケールへの変換 ----
scale:
  depth_scale: 1.0          # 奥行き（Z）方向の移動量だけに掛ける倍率

# ---- 6a. 接地の拘束（浮き・埋まりの除去） ----
# 単眼動画は奥行き（カメラからの距離）の推定がぶれ、カメラが高い位置や見下ろしだと上下の位置もずれて、
# 両足が床から浮いた（埋まった）状態が数秒続く。両足の最下点が床に着くように体全体を上下に平行移動する。
# 滞空が max_flight_sec 以下のジャンプはそのまま残る。
ground:
  enabled: true             # 座る・寝転ぶなど、両足が長く床から離れる動きでは false にする
  max_flight_sec: 0.6       # これより長く両足が床から離れている状態は、推定のずれ（浮き）とみなして床に戻す
  min_flight_sec: 0.15      # これより短い滞空の候補は床に戻す（骨盤の動きで確かめられず、ジャンプでも高さ 3cm 未満）
  flight_height_m: 0.03     # 両足の最下点が、前後 max_flight_sec の最も低い位置よりこれ以上高いフレームを滞空の候補にする
  flight_accel_g: [0.5, 2.0] # 滞空の候補のうち、骨盤の下向きの加速度がこの範囲（重力加速度 g の倍数）のものだけをジャンプとして残す。
                            #   足先だけが上がって見える区間（骨盤は上がらない）や、上下にガタつく推定の揺れを除く
  smooth_sec: 0.1           # 上下の補正量のガウシアンの σ [秒]

# ---- 6. 接地判定 ----
contact:
  enter_height_m: 0.03      # 接地開始: 高さ < 3cm かつ 水平速度 < 0.25 m/s
  enter_speed_m_per_s: 0.25
  exit_height_m: 0.05       # 接地終了: 高さ >= 5cm または 水平速度 >= 0.4 m/s
  exit_speed_m_per_s: 0.4
  fill_gap_frames: 2        # この長さ以下の非接地の隙間は埋める
  min_contact_frames: 4     # この長さ未満の接地区間は捨てる

# ---- 6b. 奥行きのぶれへの対策 ----
# 単眼動画は奥行き（カメラの前後）の推定がぶれるので、接地判定の速度からは奥行きのぶれを除き、
# 骨盤の奥行きは接地している足から求め直す（Z 方向の足滑りを防ぐ）。
depth:
  detect_root_cutoff_hz: 0.5  # 接地判定の速度: 骨盤の奥行きをこのカットオフ [Hz] で平滑化した速度と、
  detect_foot_cutoff_hz: 2.0  #   接地点の奥行きをこのカットオフで平滑化した速度の小さいほうを使う（両方 0 で平滑化しない）
  reconstruct: true         # 骨盤の奥行きを、接地中の足が前後に動かないように求め直す
  passes: 2                 # 「接地判定 → 奥行きの再構成」の回数（2 回目以降は補正後の体で判定し直す）
  contact_sigma_m: 0.005    # 接地中の足首の前後の動きの許容量（小さいほど足を固定する）
  prior_sigma_m: 0.5        # 推定された奥行きからのずれの許容量（大きいほど接地足を優先、小さいほど推定の奥行きに従う）
  accel_sigma_m_per_s2: 3.0 # 骨盤の前後の加速度の目安（小さいほど前後の動きがなめらか）

# ---- 6c. 前後の傾きの補正 ----
# 単眼動画はカメラに向かって前後に傾く角度がほとんど決まらず、足が床に平らに着いたまま体全体が前後に傾く。
# 「全身の重心は、数秒の平均では接地している足の上にある」ように、骨盤から上をカメラの左右の軸まわりに起こす。
# 姿勢の縦のラインは使わないので、重心が足の上に残るお辞儀・前傾（腰が後ろへ引かれる）はそのまま残る。
lean:
  enabled: true
  window_sec: 3.0           # 補正角を求める時間窓（ガウシアンの σ [秒]）。0 でシーケンス全体で 1 つの角度
  max_deg: 25.0             # 補正角の上限（この範囲で探す）
  outlier_m: 0.5            # 重心と支持点の奥行き方向の差がこれを超えるフレームは、差を頭打ちにする（接地判定の誤り等）。
                            #   歩行では重心が支持脚の前後に 30cm 以上離れるので、それより小さくしない（平均が偏る）
  double_support_center_weight: 0.1  # 両足接地のとき、重心を両足の中心へ寄せる重み（片足接地は 1。両足の間なら差 0）
  support_band_m: 0.02      # 接地中の足のかかと・つま先のうち、その足の最下点からこの高さ以内の点を支持点にする
  fill_gap_sec: 0.5         # 接地判定から漏れたこの長さ以下の区間は、前後の支持点をつないだ点を支持点にする（ジャンプは除く）

# ---- 7. 足ＩＫ ----
foot_ik:
  swing_one_euro: {min_cutoff: 2.0, beta: 1.0, d_cutoff: 1.0, zero_phase: true}  # 遊脚の平滑化 [m 単位]
  blend_frames: 5           # 接地区間の端から遊脚側へ差分を減衰させるフレーム数
  lock_rotation: true       # 接地中の足ＩＫの回転を区間内の平均で固定する
  snap_to_floor: true       # 接地中の足ＩＫの高さを、足裏（かかと・つま先の低いほう）が床に着く高さにする
  clamp_floor: true         # 最後に差分 Y < 0 を 0 にする
  max_boundary_step_m: 0.05 # 境界でのフレーム間移動量の目安（診断・テスト用）

# ---- 8. センターの安定化 ----
center:
  mode: A                   # A: 軸別平滑化 / B: 接地足からの逆算
  axis_one_euro:            # モードA: 骨盤位置の軸別 One Euro [m 単位]。奥行き(Z)を最も強く
    x: {min_cutoff: 1.5, beta: 0.5}
    y: {min_cutoff: 1.5, beta: 0.5}
    z: {min_cutoff: 0.5, beta: 0.3}
  d_cutoff: 1.0
  zero_phase: true
  mode_b:
    max_flight_sec: 0.6     # 両足が離れた区間がこれ以下なら上下を放物線で補間（超えたら姿勢由来の値へつなぐ）
    gravity_m_per_s2: 9.8
    final_one_euro: {min_cutoff: 3.0, beta: 0.5}  # 最後の軽い平滑化
  reach_ratio: 0.98         # 股関節から足ＩＫまでの距離をこの割合×脚長以下にする
  reach_min_window: 9       # 補正量カーブの移動最小値フィルタの窓幅
  reach_gaussian_sigma: 2.0 # 続けて掛けるガウシアンの σ（フレーム）
  reach_max_drop_m: 0.3     # 1 フレームで下げる量の上限（誤推定で極端に沈まないための保険）

# ---- 9. 上半身の回転リターゲット ----
# 補正回転は、SMPL（T ポーズ）と MMD モデル（A ポーズ）の初期姿勢が本当に違う部分（腕）だけに掛ける。
# joints / direction にすると、関節の位置を結んだ向きを合わせる方法（vmd.md の記述どおり）になるが、
# SMPL と PMX で関節の置き方が違う所では姿勢がずれる。
retarget:
  torso_up: vertical        # 体幹・首・頭: vertical（どちらも直立とみなし、左右のねじれだけ合わせる）| joints（首が前に倒れて顎が出やすい）
  collar: identity          # 肩: identity（補正しない）| direction（肩→腕の向きを合わせる。肩がすくみやすい）
  wrist: forearm            # 手首: forearm（前腕と同じ補正 = 手首はまっすぐ）| direction（手の関節への向きを合わせる）
  foot: yaw                 # 足ＩＫ: yaw（つま先の左右の向きだけ合わせる）| direction（足首→つま先の向きを合わせる。足裏が傾きやすい）

# ---- 9a. 腕どうしの貫通の防止 ----
# MMD モデルの左右の腕を、上腕・前腕・手の 3 本のカプセル（線分＋半径）で表し、左右のカプセルが重なったフレームで、
# 自重する側の腕を肩（腕ボーンの位置）まわりに回して離す。ひじ・手首の曲げは変えない（キーが変わるのは自重する側の腕ボーンだけ）。
arm_collision:
  mode: left                # left: 左腕の動きを自重する（重なったら左腕をずらす）| right: 右腕の動きを自重する | none: 何もしない
  radius_m: auto            # 腕の太さ（半径 [m]）: auto（PMX のメッシュから求める）| [上腕, 前腕, 手]
  fallback_radius_m: [0.035, 0.03, 0.025]  # auto でメッシュが無い（PMX を指定しない等）部位の半径
  radius_percentile: 50.0   # auto: 腕の頂点の、骨からの距離のこのパーセンタイルを半径にする
  radius_scale: 1.0         # 半径に掛ける倍率（大きいほど腕どうしを離す。広がった袖が重なるなら大きく）
  hand_length_m: 0.15       # 手首から指先までの長さ（auto でメッシュが無いとき。メッシュがあれば頂点から測る）
  margin_m: 0.005           # 表面どうしをさらにこれだけ離す
  max_deg: 45.0             # 補正の回転角の上限。押しのけきれずにここに達したら、その重なりは離れるまで扱わない（少しずつ通り抜ける）
  return_deg_per_s: 120.0   # 相手の腕が離れたあと、推定の姿勢へ戻す速さの上限（はね戻らないように）
  smooth_sec: 0.1           # 補正の回転をならすガウシアンの σ [秒]

# ---- 10. VMD 書き出し ----
vmd:
  model_name: ''            # 空なら PMX のモデル名（PMX が無ければ nlf2vmd）
  thin_keys: false          # キーの間引き（接地区間の開始・終了の足ＩＫキーは必ず残す）
  thin_pos_tol_m: 0.003
  thin_rot_tol_deg: 0.5

# ---- 診断出力 ----
diagnostics:
  enabled: true
  plots: true

# ---- 口パク（リップシンク）: ノートブックのセル 11a / python -m nlf2vmd.lipsync ----
# Allosaurus で認識した音素を口の形（あ・い・う・え・お・ん）に分け、声が出ている間だけ口を動かす。
# 音量は Demucs で取り出したボーカルのもの。dB のしきい値は「大きな声の音量（基準）」からの差で書く。
lipsync:
  morphs:                   # 口の形ごとのモーフ名（モデルに合わせて変える。'' でその形のキーを打たない）
    a: あ
    i: い
    u: う
    e: え
    o: お
    n: ん                   # 口を閉じる形（両唇音 m・b・p と撥音 ɴ）
  strength: 1.0             # 母音のモーフの最大値
  min_open: 0.3             # 小さな声のときの母音のモーフの値（strength に対する割合）。声が大きいほど 1 に近づく
  open_range_db: 24.0       # 基準からこの dB 小さい声で min_open になる
  closed_weight: 1.0        # ん のモーフの値（口を閉じる音は音量によらない）
  reference_percentile: 95.0  # 基準 = ボーカルの音量のこのパーセンタイル（最大から voice_off_db より小さい音は除く）
  noise_percentile: 10.0    # 雑音 = ボーカルの音量のこのパーセンタイル（Demucs で残った伴奏。声の無い所の音量）
  min_reference_dbfs: -50.0 # 基準がこれ [dBFS] より小さければ声が無いとみなし、キーをすべて 0 にする
  # 声の区間 = 音量が off より大きい連続区間のうち、on を超える時刻を含むもの（ヒステリシス）
  #   on  = 基準+voice_on_db と 雑音+on_above_noise_db の大きいほう（ただし 基準+max_on_db まで）
  #   off = 基準+voice_off_db と 雑音+off_above_noise_db の大きいほう（ただし on まで）
  voice_on_db: -30.0
  voice_off_db: -40.0
  on_above_noise_db: 12.0
  off_above_noise_db: 6.0
  max_on_db: -15.0          # 間の無い歌で雑音の見積もりが声になっても、これより大きい声は声として扱う
  fill_gap_sec: 0.05        # これ以下の無音の隙間は声が続いているとみなす
  min_voice_sec: 0.06       # これより短い声の区間は捨てる（Demucs で残った伴奏・息など）
  event_margin_sec: 0.1     # 声の区間の前後この時間までの音素は、その区間のものとして使う
  lead_sec: 0.05            # 口の形を音より早く始める時間（口は声が出る少し前に形を作る）
  consonant_sec: 0.25       # 子音から次の母音までがこれ以内なら、子音の時刻から次の母音の形にする
  max_closed_sec: 0.3       # 声が出ている間に ん（口を閉じる）を続ける最長の時間。超えたら直前の母音に戻す
  fallback_vowel: a         # 母音が 1 つも認識されなかった声の区間の口の形（a / i / u / e / o。null で口を動かさない）
  smooth_sec: 0.03          # 形の切り替え・開き具合の変化をならすガウシアンの σ [秒]
  thin_tolerance: 0.01      # キーの間引き: 線形補間との差がこれ以内なら省く（0 で全フレームにキー）

# ---- 手の形（指）: ノートブックのセル 12a / python -m nlf2vmd.hands ----
# MediaPipe Hands の手のランドマーク（21 点）から指ごとの曲げを測り、手の形（下の presets の 9 種）に分けて、
# 形ごとに決めた指の角度を指ボーンのキーにする。キーは形が変わる所だけに打つ。
hands:
  sides: both               # キーを打つ手: both | left | right
  min_presence: 0.5         # 手の存在スコアがこれ未満のフレームは、手が見えない（袖・体に隠れた・画面外）とみなす
  landmarks: screen         # 曲げを測る座標: screen（画像上の位置＋奥行き。小さく写った手ではこちらが安定）| world（3D [m]）
  # 人差し指〜小指: 付け根・第 2・第 3 関節の曲げ角の和で、伸び / 中間（軽く曲げた）/ 曲げ に分ける
  extended_below_deg: 65.0  # 和がこれより小さければ「伸び」
  curled_above_deg: 110.0   # 和がこれより大きければ「曲げ」（間は中間。中間の指がある手はデフォルトになりやすい）
  softness_deg: 25.0        # しきい値のまわりのあいまいさ（大きいほど中間の形がデフォルトになりやすい）
  # 親指: MCP・IP の曲げ角の和が小さく、かつ指先が人差し指・中指の付け根側から離れていれば「伸び」
  thumb_extended_below_deg: 50.0
  thumb_softness_deg: 20.0
  thumb_away: 0.6           # 親指の先と人差し指・中指の MCP・PIP の最短距離 ÷ 手のひらの幅（人差し指〜小指の付け根）
  thumb_away_softness: 0.2
  default_score: 0.5        # デフォルト（どの形にもはっきり当てはまらない手）の点。形の点は指ごとの確率の幾何平均（0〜1）
  smooth_sec: 0.1           # 形の点を時間方向にならすガウシアンの σ [秒]
  switch_cost: 3.0          # 形を切り替える重さ（点の対数の和で）。大きいほど、はっきり・長く続いた変化でしか切り替わらない
  min_hold_sec: 0.25        # これより短く続く形は前後の形にまとめる（ちらつき防止）
  max_gap_sec: 0.5          # 手が見えない区間がこれ以下なら、前後の形を続ける
  missing_shape: default    # それより長く手が見えない区間の形: default | hold（直前の形のまま）
  transition_sec: 0.15      # 形を切り替える時間（2 つのキーの間。補間はイーズイン・アウト）
  bones:                    # 指ボーンの名前（左・右は自動で付ける）。モデルに無いボーンはキーを打たない
    thumb: [親指０, 親指１, 親指２]
    index: [人指１, 人指２, 人指３]
    middle: [中指１, 中指２, 中指３]
    ring: [薬指１, 薬指２, 薬指３]
    pinky: [小指１, 小指２, 小指３]
  # 形ごとの 5 本の指（親指・人差し指・中指・薬指・小指）の状態:
  #   open（伸ばして開く）/ straight（伸ばす）/ relaxed（軽く曲げる）/ curled（握る）
  presets:
    default: [relaxed, relaxed, relaxed, relaxed, relaxed]
    thumb: [straight, curled, curled, curled, curled]
    index: [curled, straight, curled, curled, curled]
    middle: [curled, curled, straight, curled, curled]
    ring: [curled, curled, curled, straight, curled]
    pinky: [curled, curled, curled, curled, straight]
    fist: [curled, curled, curled, curled, curled]
    scissors: [curled, open, open, curled, curled]
    open: [open, open, open, open, open]
  # 状態ごとの指の角度 [度]: [付け根の関節, 第 2 関節, 第 3 関節, 開き]
  #   曲げは + で手のひら側へ。開きは付け根の関節を手のひらの面内で回す角度で、+ で親指側へ
  #   親指の関節は 親指０・１・２（CMC・MCP・IP）。親指の曲げは手のひら側と小指側の間へ（thumb_across）
  angles:
    thumb:
      open: [-12.0, 0.0, 0.0, 0.0]
      straight: [0.0, 0.0, 0.0, 0.0]
      relaxed: [8.0, 10.0, 10.0, 0.0]
      curled: [5.0, 55.0, 55.0, 0.0]
    index:
      open: [0.0, 0.0, 0.0, 12.0]
      straight: [0.0, 0.0, 0.0, 0.0]
      relaxed: [12.0, 20.0, 12.0, 0.0]
      curled: [80.0, 100.0, 65.0, 0.0]
    middle:
      open: [0.0, 0.0, 0.0, -6.0]
      straight: [0.0, 0.0, 0.0, 0.0]
      relaxed: [15.0, 22.0, 12.0, 0.0]
      curled: [85.0, 100.0, 65.0, 0.0]
    ring:
      open: [0.0, 0.0, 0.0, -14.0]
      straight: [0.0, 0.0, 0.0, 0.0]
      relaxed: [18.0, 24.0, 14.0, 0.0]
      curled: [88.0, 100.0, 65.0, 0.0]
    pinky:
      open: [0.0, 0.0, 0.0, -24.0]
      straight: [0.0, 0.0, 0.0, 0.0]
      relaxed: [22.0, 26.0, 16.0, 0.0]
      curled: [90.0, 95.0, 60.0, 0.0]
  thumb_across: [4.0, 3.0, 3.0]  # 親指０・１・２ の曲げの向き: 手のひら側へ 1 に対して、小指側へこの割合（大きいほど握った指の上を横切る）
